[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-hierarchy-ai"
version = "0.1.0"
description = "Stage 0/1 CPU and DirectML research harness for dynamic hierarchy hypotheses"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
cpu = ["numpy", "torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
